 /* ===== Museum Spotlight ===== */
.museum{
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  background: #070707;
  display: grid;
  place-items: center;
  padding: 72px 18px;
}

.museum-wall{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,80,120,.10), transparent 55%),
    linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
  z-index:0;
}

.museum-stage{
  position: relative;
  z-index: 2;
  display: grid;
  gap: 26px;
  justify-items: center;
}

.painting{
  position: relative;
  width: min(420px, 86vw);
}

.frame{
  padding: 14px;
  border-radius: 18px;
  background: rgba(255,255,255,.05);
  box-shadow: 0 28px 80px rgba(0,0,0,.65),
              0 0 90px rgba(255,80,120,.10);
}

.art-img{
  width: 100%;
  border-radius: 12px;
  display:block;
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}

.spotlight{
  position: absolute;
  left: 50%;
  top: -130px;
  width: 520px;
  height: 520px;
  transform: translateX(-50%);
  background:
    radial-gradient(circle at 50% 35%,
      rgba(255,255,255,.22) 0%,
      rgba(255,160,190,.12) 20%,
      transparent 62%);
  filter: blur(10px);
  opacity: .55;
  animation: museumSweep 7.5s ease-in-out infinite;
  pointer-events:none;
}

.museum.is-live .spotlight{ opacity: .95; transition: opacity .8s ease; }

@keyframes museumSweep{
  0%   { transform: translateX(-50%) rotate(-6deg); }
  50%  { transform: translateX(-44%) rotate(7deg); }
  100% { transform: translateX(-50%) rotate(-6deg); }
}

.exhibit{
  text-align:center;
  color:#f0f0f0;
  margin-top:30px;
  max-width: 640px;
}

.exhibit-line{
  display:block;

}

/* ===== Music Button ===== */
.music-btn{
  position:fixed;
  bottom:24px;
  right:24px;
  width:46px;
  height:46px;

}
.music-btn.active{
  box-shadow:
    0 0 18px rgba(255,80,120,.4),

}

<body>
  <!-- Password Gate -->
  <div class="gate-wrapper" id="gate">
    <div class="gate-card">
      <div class="gate-title">Private Invitation</div>
      <div class="gate-subtitle">for one person only</div>
      <div class="gate-name">
        <span>save the date</span>
        Krystal <span class="accent-name">"BEAUTIFULLY BLESSED"</span> Cox

      </div>
      <input
        id="passInput"
        class="gate-input"
        type="password"
        placeholder="Enter your access word"
        autocomplete="off"
      />
      <button class="gate-button" id="gateButton">Unlock</button>
      <div class="gate-hint">Hint: something he would say to you.</div>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>
  <main id="content" class="content-hidden">
  <section class="museum">
    <div class="museum-wall"></div>

    <div class="museum-stage">
      <div class="dust"></div>

      <div class="painting">
        <div class="spotlight"></div>
        <div class="frame">
          <img src="krystal-valentines.jpg" alt="Portrait" class="art-img">
        </div>
      </div>

      <div class="exhibit">
        <span class="exhibit-line"></span>
        <p class="exhibit-text">
          Not everything meaningful needs big words —<br>
          sometimes it’s just recognizing someone rare.
        </p>
      </div>
    </div>
  </section>
</main>
   <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="valentine-music.m4a" type="audio/mp4">
  </audio>

  <!-- Music Toggle Button -->
  <button id="playMusicBtn" class="music-btn" style="display:none;">♪</button>

  <script>
    (function () {

      var correctPassword = "IMCHECKn4krys";
      var gate = document.getElementById("gate");
      var content = document.getElementById("content");
      var input = document.getElementById("passInput");
      var button = document.getElementById("gateButton");
      var error = document.getElementById("gateError");
      var music = document.getElementById("bgMusic");
      var playBtn = document.getElementById("playMusicBtn");

      function showPlayButton() {
        if (playBtn) playBtn.style.display = "block";
      }

      function fadeInAudio() {
        var vol = 0;
        music.volume = 0;

        var fade = setInterval(function () {
          if (vol < 0.25) {
            vol += 0.02;
            music.volume = vol;
          } else {
            clearInterval(fade);
          }
        }, 120);
      }

      function tryUnlock() {
        if (input.value.trim() === correctPassword) {

          gate.style.display = "none";
          content.classList.remove("content-hidden");
          window.scrollTo(0, 0);
          showPlayButton();
          document.querySelector(".museum")?.classList.add("is-live");

          try {
            music.play();
            fadeInAudio();
            playBtn.classList.add("active");
          } catch (e) {
            console.log("Autoplay blocked:", e);
          }

        } else {
          error.textContent = "That doesn't look quite right. Try again.";
          input.value = "";
          input.focus();
        }
      }

      if (button) button.addEventListener("click", tryUnlock);

      if (input) {
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") tryUnlock();
        });
      }

      if (playBtn && music) {
        playBtn.addEventListener("click", function (e) {
          e.stopPropagation();

          if (music.paused) {
            music.play();
            fadeInAudio();
            playBtn.classList.add("active");
          } else {
            music.pause();
            playBtn.classList.remove("active");
          }
        });
      }

    })();
  </script>
</body>
